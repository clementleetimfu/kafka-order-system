server:
  port: 8082

spring:
  application:
    name: order-notification-service
  kafka:
    bootstrap-servers: 192.168.100.131:9092,192.168.100.131:9093,192.168.100.131:9094
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

mailgun:
  api-key: ${MAILGUN_API_KEY}
  domain: ${MAILGUN_DOMAIN}
  from: noreply@kafka-order-system.com

logging:
  level:
    root: INFO