services:
  kafka-1:
    image: apache/kafka:4.1.1
    container_name: kafka-1
    ports:
      - "9092:9092"
    volumes:
      - /usr/local/docker/kafka/cluster/kraft/kafka-1/config:/mnt/shared/config
    networks:
      - kafka-kraft-cluster-net
  kafka-2:
    image: apache/kafka:4.1.1
    container_name: kafka-2
    ports:
      - "9093:9092"
    volumes:
      - /usr/local/docker/kafka/cluster/kraft/kafka-2/config:/mnt/shared/config
    networks:
      - kafka-kraft-cluster-net
  kafka-3:
    image: apache/kafka:4.1.1
    container_name: kafka-3
    ports:
      - "9094:9092"
    volumes:
      - /usr/local/docker/kafka/cluster/kraft/kafka-3/config:/mnt/shared/config
    networks:
      - kafka-kraft-cluster-net

networks:
  kafka-kraft-cluster-net:
    name: demo-kafka-kraft-cluster-net